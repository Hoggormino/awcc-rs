name: Bug Report
description: Report a defect, crash, or incorrect hardware/UI outcome in awcc-cli or awcc-gui.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in **awcc-rs**.
        - Most environment, build, and hardware-profile details are captured automatically by `awcc-cli diagnostics export --output awcc-support.zip` (or **Log → Export Support Report** in `awcc-gui`).
        - **Privacy**: Never include your machine serial number, Dell Service Tag, or private tokens. The support bundle redacts local usernames, hostnames, and serials automatically.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which subsystem is primarily affected?
      options:
        - "GUI (awcc-gui)"
        - "Thermal / Fans / G-Mode / TCC (area: thermal)"
        - "Lighting / USB ELC / Stealth (area: lighting)"
        - "Packaging / systemd / udev / AppImage (area: packaging)"
        - "Hardware Profile / DMI Detection (area: hardware)"
    validations:
      required: true

  - type: dropdown
    id: install_format
    attributes:
      label: Installation format
      description: How did you install or run awcc-rs? (Also shown as `package-format:` in `--version`.)
      options:
        - "Debian / Ubuntu package (.deb)"
        - "Fedora / RPM package (.rpm)"
        - "Arch Linux / CachyOS package (.pkg.tar.zst)"
        - "AppImage (.AppImage)"
        - "Binary archive (.tar.gz)"
        - "Built from source (cargo)"
        - "Unknown / other"
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Application version (`awcc-cli --version` or `awcc-gui --version`)
      description: Paste the output of `awcc-cli --version` or `awcc-gui --version` (or state the package version if neither binary starts).
      placeholder: |
        awcc-cli 0.1.0 (d4c4012, clean)
        version: 0.1.0
        commit: d4c4012...
        package-format: deb
      render: text
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. actual behavior
      description: Describe what you expected to happen and what actually happened (including any error messages or lifecycle badges such as `ACCEPTED`, `CONFIRMED`, `FAILED`, or `ROLLED BACK`).
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or exact CLI command used to trigger the problem.
      placeholder: |
        1. Run `...`
        2. Click `...`
        3. Observe `...`
    validations:
      required: true

  - type: input
    id: regression
    attributes:
      label: Regression / last working version
      description: Did this work in an earlier awcc-rs version or commit? If unknown or first time testing, write "No / first install" or "Unknown".
      placeholder: "No / first install (or e.g. worked in v0.1.0)"
    validations:
      required: false

  - type: dropdown
    id: diagnostics_status
    attributes:
      label: Diagnostic evidence availability
      description: A passive support export (`awcc-support.zip`) avoids manual environment questions. If the application fails before export can run, select the startup-failure option and paste terminal output below.
      options:
        - "Attached awcc-support.zip (or pasted `awcc-cli diagnostics summary` below)"
        - "Application startup / launch failure — diagnostic export unavailable (terminal output pasted below)"
        - "Diagnostic export unavailable for another reason (explained below)"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Support report (`awcc-support.zip`), diagnostic summary, or terminal output
      description: |
        Drag and drop `awcc-support.zip` generated by `awcc-cli diagnostics export --output awcc-support.zip` (or **Log → Export Support Report** in `awcc-gui`), paste `awcc-cli diagnostics summary`, or—if startup failed—paste the terminal output from `awcc-gui -v` / `awcc-cli -v` and explain why export was unavailable.
      placeholder: |
        Attach awcc-support.zip here, or paste `awcc-cli diagnostics summary` / `awcc-gui -v` stderr output.
    validations:
      required: true
